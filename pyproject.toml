[project]
name = "clinicalchatbackend"
version = "0.1.0"
description = "FastAPI backend for clinical trial search, chat, and protocol analysis workflows."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiofiles>=23.0.0",
    "bcrypt>=4.0.0",
    "chromadb>=0.4.0",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "groq>=0.4.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "openai>=1.0.0",
    "pymongo>=4.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.17.0",
    "requests>=2.31.0",
    "tiktoken>=0.5.0",
    "tqdm>=4.66.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]
